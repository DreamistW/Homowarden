<?xml version="1.0" encoding="UTF-8"?>
<svg
        xmlns="http://www.w3.org/2000/svg"
        width="1024"
        height="1024"
        viewBox="0 0 1024 1024"
        fill="none">

    <!-- 左侧节点 -->
    <circle cx="380" cy="512" r="90" fill="#FFFFFF"/>

    <!-- 右上节点 -->
    <circle cx="660" cy="360" r="90" fill="#FFFFFF"/>

    <!-- 右下节点 -->
    <circle cx="660" cy="664" r="90" fill="#FFFFFF"/>

    <!-- 连接线 -->
    <line x1="380" y1="512" x2="660" y2="360"
          stroke="#FFFFFF"
          stroke-width="60"
          stroke-linecap="round"/>

    <line x1="380" y1="512" x2="660" y2="664"
          stroke="#FFFFFF"
          stroke-width="60"
          stroke-linecap="round"/>

</svg>
