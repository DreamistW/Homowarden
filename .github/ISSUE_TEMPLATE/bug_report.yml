name: 缺陷反馈 / Bug report
description: 报告应用崩溃、同步失败、显示错误等问题
labels: [bug]
title: "[Bug] "
body:
  - type: markdown
    attributes:
      value: |
        请尽量填写完整信息，便于复现和定位。
        **请勿粘贴主密码、密钥、token、备份文件或未脱敏日志。**

  - type: input
    id: version
    attributes:
      label: 应用版本 / App version
      description: 设置页或应用市场中的版本号
      placeholder: "2.0.0"
    validations:
      required: true

  - type: dropdown
    id: device
    attributes:
      label: 设备类型 / Device
      options:
        - 手机 Phone
        - 平板 Tablet
        - 电脑 PC
        - 2in1
    validations:
      required: true

  - type: input
    id: os
    attributes:
      label: 系统版本 / HarmonyOS version
      placeholder: "HarmonyOS 6.0"
    validations:
      required: true

  - type: dropdown
    id: server
    attributes:
      label: 服务器类型 / Server
      options:
        - bitwarden.com
        - bitwarden.eu
        - 自托管 Self-hosted
        - 不确定 Unknown
    validations:
      required: true

  - type: textarea
    id: what-happened
    attributes:
      label: 问题描述 / What happened
      description: 实际结果是什么？预期结果是什么？
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: 复现步骤 / Steps to reproduce
      placeholder: |
        1.
        2.
        3.
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: 日志 / Logs
      description: 可选。请先脱敏 token、密码、邮箱等敏感信息。
      render: text

  - type: checkboxes
    id: checks
    attributes:
      label: 提交前确认
      options:
        - label: 我已搜索现有 Issue，确认不是重复问题
          required: true
        - label: 内容中不含主密码、密钥或其他敏感凭据
          required: true
