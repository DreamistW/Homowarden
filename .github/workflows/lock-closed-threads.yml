name: Lock closed threads

on:
  schedule:
    - cron: "0 1 * * *"
  workflow_dispatch:

permissions:
  issues: write
  pull-requests: write

jobs:
  lock:
    runs-on: ubuntu-latest
    steps:
      - uses: dessant/lock-threads@v5
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          issue-inactive-days: "30"
          pr-inactive-days: "30"
          process-only: "issues, prs"
          issue-comment: "This thread has been locked because it has been closed for 30 days with no activity."
          pr-comment: "This thread has been locked because it has been closed for 30 days with no activity."
